# Apply - plan, then apply that plan after human approval. Never one without the
# other.
#
# Every apply in this workflow consumes a plan file produced by an earlier job in
# the same run. `terraform apply` is only ever handed a saved plan.

name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - 'deployment/**'
      - 'modules/**'
      - '.github/workflows/terraform-apply.yml'
      - '.github/workflows/_terraform-run.yml'
      - '.github/scripts/**'
  # A manual run has no diff to filter against, so it applies EVERY pair matching the narrowing below
  workflow_dispatch:
    inputs:
      account:
        description: 'Account directory name, or "all".'
        required: false
        default: 'all'
        type: string
      layer:
        description: 'Layer directory name, or "all".'
        required: false
        default: 'all'
        type: string

permissions:
  contents: read

concurrency:
  group: tf-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  discover:
    name: select affected pairs
    runs-on: ubuntu-latest
    outputs:
      tier0: ${{ steps.select.outputs.tier0 }}
      tier1: ${{ steps.select.outputs.tier1 }}
      tier0_any: ${{ steps.select.outputs.tier0_any }}
      tier1_any: ${{ steps.select.outputs.tier1_any }}
      any: ${{ steps.select.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select
        id: select
        env:
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
          ONLY_ACCOUNT: ${{ inputs.account || 'all' }}
          ONLY_LAYER: ${{ inputs.layer || 'all' }}
        run: bash .github/scripts/tf-matrix.sh

      - name: Refuse to run if the dependency graph is deeper than this workflow
        env:
          TIER_COUNT: ${{ steps.select.outputs.tier_count }}
        run: |
          set -euo pipefail
          # A GitHub Actions job graph is static YAML - it cannot grow a stage at
          # runtime. Failing here is the safe outcome: the alternative is applying
          # tiers 1 and 2 and silently never applying tier 3.
          if [[ "${TIER_COUNT:-0}" -gt 2 ]]; then
            echo "::error::the layer dependency graph now has $TIER_COUNT tiers," \
                 "but this workflow defines 2. Add a plan/apply stage pair for the" \
                 "new tier, and update the guard in ci.yml."
            exit 1
          fi

  # TIER 1 - layers with no upstream dependency
  plan-tier0:
    name: plan (tier 1)
    needs: discover
    if: needs.discover.outputs.tier0_any == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.tier0) }}
    uses: ./.github/workflows/_terraform-run.yml
    with:
      account: ${{ matrix.account }}
      layer: ${{ matrix.layer }}
      mode: plan
      # The plan environment holds a read-only token. Planning never needs write
      # access, so the write token stays behind the approval gate below.
      environment: ${{ matrix.account }}-plan
      plan_artifact: tfplan-${{ matrix.account }}-${{ matrix.layer }}-${{ github.run_id }}-${{ github.run_attempt }}
    secrets: inherit

  apply-tier0:
    name: apply (tier 1)
    needs: [discover, plan-tier0]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.tier0) }}
    uses: ./.github/workflows/_terraform-run.yml
    with:
      account: ${{ matrix.account }}
      layer: ${{ matrix.layer }}
      mode: apply
      environment: ${{ matrix.account }}-${{ matrix.layer }}-apply
      plan_artifact: tfplan-${{ matrix.account }}-${{ matrix.layer }}-${{ github.run_id }}-${{ github.run_attempt }}
    secrets: inherit

  # TIER 2 - layers that resolve a zone by lookup.
  # These cannot even be PLANNED before tier 1 has applied, which is why the plan job depends on apply-tier0 rather than running alongside tier 1.
  plan-tier1:
    name: plan (tier 2)
    needs: [discover, apply-tier0]
    # apply-tier0 is legitimately skipped when nothing in tier 1 changed, so this
    # cannot use the default "all needs succeeded". It must still stop if tier 1
    # actually failed or the run was cancelled.
    if: >-
      !failure() && !cancelled() &&
      needs.discover.outputs.tier1_any == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.tier1) }}
    uses: ./.github/workflows/_terraform-run.yml
    with:
      account: ${{ matrix.account }}
      layer: ${{ matrix.layer }}
      mode: plan
      environment: ${{ matrix.account }}-plan
      plan_artifact: tfplan-${{ matrix.account }}-${{ matrix.layer }}-${{ github.run_id }}-${{ github.run_attempt }}
    secrets: inherit

  apply-tier1:
    name: apply (tier 2)
    needs: [discover, plan-tier1]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.tier1) }}
    uses: ./.github/workflows/_terraform-run.yml
    with:
      account: ${{ matrix.account }}
      layer: ${{ matrix.layer }}
      mode: apply
      environment: ${{ matrix.account }}-${{ matrix.layer }}-apply
      plan_artifact: tfplan-${{ matrix.account }}-${{ matrix.layer }}-${{ github.run_id }}-${{ github.run_attempt }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  apply-complete:
    name: apply complete
    runs-on: ubuntu-latest
    needs: [discover, plan-tier0, apply-tier0, plan-tier1, apply-tier1]
    if: always()
    steps:
      - name: Report
        run: |
          set -euo pipefail
          # Bracket notation: a hyphen in a property path is ambiguous with
          # subtraction in GitHub's expression syntax.
          declare -A R=(
            [discover]='${{ needs.discover.result }}'
            [plan-tier0]='${{ needs['plan-tier0'].result }}'
            [apply-tier0]='${{ needs['apply-tier0'].result }}'
            [plan-tier1]='${{ needs['plan-tier1'].result }}'
            [apply-tier1]='${{ needs['apply-tier1'].result }}'
          )

          {
            echo "### Apply run summary"
            echo
            echo "| Stage | Result |"
            echo "|---|---|"
            for stage in discover plan-tier0 apply-tier0 plan-tier1 apply-tier1; do
              echo "| $stage | ${R[$stage]} |"
            done
          } >>"$GITHUB_STEP_SUMMARY"

          if [[ "${R[discover]}" != "success" ]]; then
            echo "::error::could not determine what to apply"
            exit 1
          fi

          # `skipped` is a normal outcome: a stage is skipped when its tier had no
          # affected pairs, or when a reviewer declined the approval. Only an
          # outright failure or cancellation is an error here.
          for stage in plan-tier0 apply-tier0 plan-tier1 apply-tier1; do
            case "${R[$stage]}" in
              success|skipped) ;;
              *) echo "::error::$stage: ${R[$stage]}"; exit 1 ;;
            esac
          done

          if [[ "${{ needs.discover.outputs.any }}" == "false" ]]; then
            echo "No Terraform-affecting change - nothing applied."
          fi
