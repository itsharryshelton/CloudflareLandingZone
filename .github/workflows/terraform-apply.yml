# Apply - plan, then apply that plan after human approval. Never one without the other.
#
# Stages run strictly in sequence, because each tier's PLAN can depend on the previous tier's APPLY having already happened:
#
#   tier 1  account_governance  - account-wide permissions and resource-group
#                                 scope. Every later tier's token is evaluated
#                                 against what this applies, so it goes first.
#   tier 2  zones + layers that touch no zone - parallel.
#   tier 3  layers that need a zone to already exist - parallel. Either they
#           resolve one with data "cloudflare_zone", or they address resources
#           by hostname (zerotrust). Cannot be planned until tier 2 has run.
#
# Which layer lands in which tier is derived in .github/scripts/tf-matrix.sh, not listed here.
#
# After the last tier, the resource-tags job applies Cloudflare resource tags
# from the manifests the tagging layers exported - see resource-tags.sh.

name: Terraform Apply

on:
  # Manual only
  workflow_dispatch:
    inputs:
      account:
        description: 'Account directory name, or "all".'
        required: false
        default: 'all'
        type: string
      layer:
        description: 'Layer directory name, or "all".'
        required: false
        default: 'all'
        type: string

permissions:
  contents: read

concurrency:
  group: tf-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  discover:
    name: select affected pairs
    runs-on: ubuntu-latest
    outputs:
      tier0: ${{ steps.select.outputs.tier0 }}
      tier1: ${{ steps.select.outputs.tier1 }}
      tier2: ${{ steps.select.outputs.tier2 }}
      tier0_any: ${{ steps.select.outputs.tier0_any }}
      tier1_any: ${{ steps.select.outputs.tier1_any }}
      tier2_any: ${{ steps.select.outputs.tier2_any }}
      any: ${{ steps.select.outputs.any }}
      tag_accounts: ${{ steps.tags.outputs.tag_accounts }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select
        id: select
        env:
          # Every run here is a manual one, so there is no diff to narrow against.
          HEAD_SHA: ${{ github.sha }}
          FORCE_ALL: 'true'
          ONLY_ACCOUNT: ${{ inputs.account || 'all' }}
          ONLY_LAYER: ${{ inputs.layer || 'all' }}
        run: bash .github/scripts/tf-matrix.sh

      # Accounts the resource-tags job runs for: those with a tagging layer among
      # the selected pairs. A layer tags if it outputs resource_tags - read from
      # the source like every other classification here, so a layer that starts
      # tagging needs no edit to this workflow.
      - name: Select accounts to tag
        id: tags
        env:
          MATRIX: ${{ steps.select.outputs.matrix }}
        run: |
          set -euo pipefail
          tagging=()
          for layer_dir in deployment/layers/*/; do
            if grep -rhqE '^[[:space:]]*output[[:space:]]+"resource_tags"' "$layer_dir"*.tf; then
              tagging+=("$(basename "$layer_dir")")
            fi
          done
          layers_json="$(jq -c -n '$ARGS.positional' --args "${tagging[@]}")"
          accounts="$(jq -c --argjson ls "$layers_json" '[.[] | select(.layer as $l | $ls | index($l)) | .account] | unique' <<<"$MATRIX")"
          echo "tagging layers: $layers_json - accounts to tag: $accounts"
          echo "tag_accounts=$accounts" >>"$GITHUB_OUTPUT"

      - name: Refuse to run if the dependency graph is deeper than this workflow
        env:
          TIER_COUNT: ${{ steps.select.outputs.tier_count }}
        run: |
          set -euo pipefail
          # A GitHub Actions job graph is static YAML - it cannot grow a stage at
          # runtime. Failing here is the safe outcome: the alternative is applying
          # tiers 1 and 2 and silently never applying tier 3.
          if [[ "${TIER_COUNT:-0}" -gt 3 ]]; then
            echo "::error::the layer dependency graph now has $TIER_COUNT tiers," \
                 "but this workflow defines 3. Add a plan/apply stage pair for the" \
                 "new tier, and update the guard in ci.yml."
            exit 1
          fi

  # TIER 1 - account-wide prerequisites (account_governance).
  plan-tier0:
    name: plan (tier 1)
    needs: discover
    if: needs.discover.outputs.tier0_any == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.tier0) }}
    uses: ./.github/workflows/_terraform-run.yml
    with:
      account: ${{ matrix.account }}
      layer: ${{ matrix.layer }}
      mode: plan
      # The plan environment holds a read-only token. Planning never needs write
      # access, so the write token stays behind the approval gate below.
      environment: ${{ matrix.account }}-plan
      plan_artifact: tfplan-${{ matrix.account }}-${{ matrix.layer }}-${{ github.run_id }}-${{ github.run_attempt }}
    secrets: inherit

  apply-tier0:
    name: apply (tier 1)
    needs: [discover, plan-tier0]
    if: >-
      !cancelled() &&
      needs['plan-tier0'].result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.tier0) }}
    uses: ./.github/workflows/_terraform-run.yml
    with:
      account: ${{ matrix.account }}
      layer: ${{ matrix.layer }}
      mode: apply
      environment: ${{ matrix.account }}-${{ matrix.layer }}-apply
      plan_artifact: tfplan-${{ matrix.account }}-${{ matrix.layer }}-${{ github.run_id }}-${{ github.run_attempt }}
      tags_artifact: tags__${{ matrix.account }}__${{ matrix.layer }}__${{ github.run_id }}-${{ github.run_attempt }}
    secrets: inherit

  # TIER 2 - zones, plus every layer that touches no zone.
  # Planned only after tier 1 has applied: a permission or resource-group scope
  # change in account_governance decides what this tier's token may even read, so
  # planning alongside it would race the authz change.
  plan-tier1:
    name: plan (tier 2)
    needs: [discover, apply-tier0]
    if: >-
      !failure() && !cancelled() &&
      needs.discover.outputs.tier1_any == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.tier1) }}
    uses: ./.github/workflows/_terraform-run.yml
    with:
      account: ${{ matrix.account }}
      layer: ${{ matrix.layer }}
      mode: plan
      environment: ${{ matrix.account }}-plan
      plan_artifact: tfplan-${{ matrix.account }}-${{ matrix.layer }}-${{ github.run_id }}-${{ github.run_attempt }}
    secrets: inherit

  apply-tier1:
    name: apply (tier 2)
    needs: [discover, plan-tier1]
    if: >-
      !cancelled() &&
      needs['plan-tier1'].result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.tier1) }}
    uses: ./.github/workflows/_terraform-run.yml
    with:
      account: ${{ matrix.account }}
      layer: ${{ matrix.layer }}
      mode: apply
      environment: ${{ matrix.account }}-${{ matrix.layer }}-apply
      plan_artifact: tfplan-${{ matrix.account }}-${{ matrix.layer }}-${{ github.run_id }}-${{ github.run_attempt }}
      tags_artifact: tags__${{ matrix.account }}__${{ matrix.layer }}__${{ github.run_id }}-${{ github.run_attempt }}
    secrets: inherit

  # TIER 3 - layers that need a zone to already exist.
  # These cannot even be PLANNED before tier 2 has applied, which is why the plan
  # job depends on apply-tier1 rather than running alongside tier 2.
  plan-tier2:
    name: plan (tier 3)
    needs: [discover, apply-tier1]
    if: >-
      !failure() && !cancelled() &&
      needs.discover.outputs.tier2_any == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.tier2) }}
    uses: ./.github/workflows/_terraform-run.yml
    with:
      account: ${{ matrix.account }}
      layer: ${{ matrix.layer }}
      mode: plan
      environment: ${{ matrix.account }}-plan
      plan_artifact: tfplan-${{ matrix.account }}-${{ matrix.layer }}-${{ github.run_id }}-${{ github.run_attempt }}
    secrets: inherit

  apply-tier2:
    name: apply (tier 3)
    needs: [discover, plan-tier2]
    if: >-
      !cancelled() &&
      needs['plan-tier2'].result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.tier2) }}
    uses: ./.github/workflows/_terraform-run.yml
    with:
      account: ${{ matrix.account }}
      layer: ${{ matrix.layer }}
      mode: apply
      environment: ${{ matrix.account }}-${{ matrix.layer }}-apply
      plan_artifact: tfplan-${{ matrix.account }}-${{ matrix.layer }}-${{ github.run_id }}-${{ github.run_attempt }}
      tags_artifact: tags__${{ matrix.account }}__${{ matrix.layer }}__${{ github.run_id }}-${{ github.run_attempt }}
    secrets: inherit

  # RESOURCE TAGS - after the last tier, from what each tagging layer has just
  # output. Not Terraform: the provider has no tagging resource yet. See
  # .github/scripts/resource-tags.sh and "Resource tags" in the README.
  #
  # A job of its own, in an environment of its own, so no layer's token needs
  # tag write and the tag token can do nothing but tag. That environment has no
  # reviewers: the job writes only what the approved applies above just output,
  # and has no plan of its own to show, so it starts as soon as they finish.
  resource-tags:
    name: resource tags
    needs: [discover, apply-tier0, apply-tier1, apply-tier2]
    # Runs if any apply ran at all, including one that partly failed: the layers
    # that did apply uploaded a manifest, and only those are tagged. Skipped when
    # the run selected no tagging layer.
    if: >-
      !cancelled() &&
      needs.discover.outputs.tag_accounts != '[]' &&
      (needs['apply-tier0'].result != 'skipped' ||
       needs['apply-tier1'].result != 'skipped' ||
       needs['apply-tier2'].result != 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        account: ${{ fromJSON(needs.discover.outputs.tag_accounts) }}
    environment: ${{ matrix.account }}-tags-apply
    # One tagging run per account at a time. Not cancel-in-progress, for the
    # same reason as the Terraform runs: a cancelled run stops between writes.
    concurrency:
      group: tags-${{ matrix.account }}
      cancel-in-progress: false
    env:
      ACCOUNT_DIR: deployment/accounts/${{ matrix.account }}
      TAGS_ENVIRONMENT: ${{ matrix.account }}-tags-apply
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # Double underscores in the artifact name, so one account's pattern
      # cannot match another account whose name it is a prefix of.
      - name: Download this run's tag manifests
        uses: actions/download-artifact@v8
        with:
          pattern: tags__${{ matrix.account }}__*__${{ github.run_id }}-${{ github.run_attempt }}
          merge-multiple: true
          path: resource-tags

      - name: Apply resource tags
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::missing secret CLOUDFLARE_API_TOKEN (environment '$TAGS_ENVIRONMENT'). See .github/workflows/README.md."
            exit 1
          fi
          # The account ID is a fact of the account tree, read the same way
          # _terraform-run.yml reads it for the token check and the KV load.
          CLOUDFLARE_ACCOUNT_ID="$(grep -oE '[0-9a-f]{32}' "$ACCOUNT_DIR/account.tfvars" | head -n1)"
          export CLOUDFLARE_ACCOUNT_ID
          bash .github/scripts/resource-tags.sh resource-tags

      - name: Remove the manifests
        if: always()
        run: rm -rf resource-tags

  # ---------------------------------------------------------------------------
  apply-complete:
    name: apply complete
    runs-on: ubuntu-latest
    needs:
      [
        discover,
        plan-tier0,
        apply-tier0,
        plan-tier1,
        apply-tier1,
        plan-tier2,
        apply-tier2,
        resource-tags,
      ]
    if: always()
    steps:
      - name: Report
        run: |
          set -euo pipefail
          # Bracket notation: a hyphen in a property path is ambiguous with
          # subtraction in GitHub's expression syntax.
          declare -A R=(
            [discover]='${{ needs.discover.result }}'
            [plan-tier0]='${{ needs['plan-tier0'].result }}'
            [apply-tier0]='${{ needs['apply-tier0'].result }}'
            [plan-tier1]='${{ needs['plan-tier1'].result }}'
            [apply-tier1]='${{ needs['apply-tier1'].result }}'
            [plan-tier2]='${{ needs['plan-tier2'].result }}'
            [apply-tier2]='${{ needs['apply-tier2'].result }}'
            [resource-tags]='${{ needs['resource-tags'].result }}'
          )

          STAGES=(discover plan-tier0 apply-tier0 plan-tier1 apply-tier1 plan-tier2 apply-tier2 resource-tags)

          {
            echo "### Apply run summary"
            echo
            echo "| Stage | Result |"
            echo "|---|---|"
            for stage in "${STAGES[@]}"; do
              echo "| $stage | ${R[$stage]} |"
            done
          } >>"$GITHUB_STEP_SUMMARY"

          if [[ "${R[discover]}" != "success" ]]; then
            echo "::error::could not determine what to apply"
            exit 1
          fi

          # `skipped` is a normal outcome for a stage whose tier had no affected
          # pairs - narrowing to one layer skips the other two tiers entirely.
          # Only an outright failure or cancellation is an error here; the
          # skipped-but-shouldn't-have-been case is caught below.
          for stage in "${STAGES[@]:1}"; do
            case "${R[$stage]}" in
              success|skipped) ;;
              *) echo "::error::$stage: ${R[$stage]}"; exit 1 ;;
            esac
          done

          # A plan that succeeded with no apply behind it is the one shape of
          # "everything skipped" that must not go green: the operator asked for
          # an apply, a plan was produced and approved, and nothing executed it.
          # Either the approval was declined - in which case a red run is the
          # honest record that the apply did not happen - or a `needs`/`if`
          # regression has reintroduced skip propagation down the tier chain.
          for n in 0 1 2; do
            if [[ "${R[plan-tier$n]}" == "success" && "${R[apply-tier$n]}" == "skipped" ]]; then
              echo "::error title=Plan was not applied::plan-tier$n succeeded but apply-tier$n did not run. If the approval was declined, re-run once approved; otherwise apply-tier$n's \`if\` condition is skipping a plan that should have been applied."
              exit 1
            fi
          done

          if [[ "${{ needs.discover.outputs.any }}" == "false" ]]; then
            echo "No Terraform-affecting change - nothing applied."
          fi
