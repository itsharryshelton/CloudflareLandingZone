# =============================================================================
# Reusable: run one layer, against one account, in one mode.
#
# One invocation == one Terraform state == one {account, layer} pair
#
# MODES
#   plan   init, plan to a file, upload the plan as an artifact, publish a
#          value-free summary of what would change.
#   apply  init, download that same plan file, `terraform apply <plan>`.
#
# Apply NEVER generates its own plan, by design so that a reviewer has approved what is being applied
# =============================================================================
name: terraform-run

on:
  workflow_call:
    inputs:
      account:
        description: 'Account directory name under deployment/accounts/.'
        required: true
        type: string
      layer:
        description: 'Layer directory name under deployment/layers/.'
        required: true
        type: string
      mode:
        description: 'plan | apply'
        required: true
        type: string
      environment:
        description: >-
          GitHub Environment supplying CLOUDFLARE_API_TOKEN (and, for apply, the
          required reviewers that gate this job).
        required: true
        type: string
      plan_artifact:
        description: 'Artifact name to write the plan to (plan) or read it from (apply).'
        required: true
        type: string
      terraform_version:
        required: false
        type: string
        default: '1.14.6'
      parallelism:
        description: >-
          Terraform's -parallelism. Lower than the default 10, but this is the
          secondary control, not the throttle: it caps how many resources are
          worked on at once, not the request rate. The rate limiter below is
          what keeps a run inside Cloudflare's budget. This exists so that a run
          with the limiter disabled, or one where it dies, degrades gently
          instead of burning the whole budget in a minute.
        required: false
        type: number
        default: 4
      api_rps:
        description: >-
          Sustained Cloudflare API requests per second, enforced by
          .github/scripts/cf-api-throttle.py. Cloudflare allows 1200 per 5
          minutes per credential, which is 4.0/s; 3.5 leaves headroom for
          anything else using the same token. Set to 0 to bypass the limiter
          entirely - only for debugging, and expect 429s on the zones layer.
        required: false
        type: number
        default: 3.5
      comment_on_pr:
        description: 'Post the value-free plan summary as a pull request comment.'
        required: false
        type: boolean
        default: false
      plan_retention_days:
        description: >-
          Artifact retention. Kept short: a plan file contains resolved zone IDs,
          DNS record contents and full WAF rule expressions.
        required: false
        type: number
        default: 5

# NOTE: `permissions` is deliberately not declared here. A called workflow cannot
# hold more than its caller granted, so each caller sets its own least-privilege
# scope and this job inherits it. Declaring `pull-requests: write` here would
# break terraform-apply.yml, which does not grant it.

jobs:
  terraform:
    name: ${{ inputs.mode }} ${{ inputs.account }} / ${{ inputs.layer }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    # Serialise every operation against a single state key. `use_lockfile = true`
    #
    # cancel-in-progress is false on purpose: cancelling mid-apply is how you get
    # resources that exist in Cloudflare but not in state.
    concurrency:
      group: tf-${{ inputs.account }}-${{ inputs.layer }}
      cancel-in-progress: false

    defaults:
      run:
        shell: bash

    env:
      TF_IN_AUTOMATION: '1'
      TF_INPUT: '0'
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
      LAYER_DIR: deployment/layers/${{ inputs.layer }}
      ACCOUNT_DIR: deployment/accounts/${{ inputs.account }}
      MODE: ${{ inputs.mode }}
      TF_PARALLELISM: ${{ inputs.parallelism }}
      CF_THROTTLE_RPS: ${{ inputs.api_rps }}
      CF_THROTTLE_PORT: '8787'
      CF_THROTTLE_PID: ${{ github.workspace }}/.cf-throttle.pid
      CF_THROTTLE_LOG: ${{ github.workspace }}/.cf-throttle.log
      STATE_KEY: ${{ inputs.account }}/${{ inputs.layer }}.tfstate
      TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
      TF_BACKEND_ENDPOINT: ${{ vars.TF_BACKEND_ENDPOINT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check inputs and required configuration
        # Scoped to this step rather than the job: the App private key is only
        # needed for a presence check here and by the token step below, so no
        # other step gets it in its environment.
        env:
          MODULES_APP_ID: ${{ vars.MODULES_APP_ID }}
          MODULES_APP_PRIVATE_KEY: ${{ secrets.MODULES_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          case "$MODE" in
            plan|apply) ;;
            *) echo "::error::mode must be 'plan' or 'apply', got '$MODE'"; exit 1 ;;
          esac

          missing=()
          [[ -n "${CLOUDFLARE_API_TOKEN:-}"  ]] || missing+=("secret CLOUDFLARE_API_TOKEN (environment '${{ inputs.environment }}')")
          [[ -n "${AWS_ACCESS_KEY_ID:-}"     ]] || missing+=("secret R2_ACCESS_KEY_ID")
          [[ -n "${AWS_SECRET_ACCESS_KEY:-}" ]] || missing+=("secret R2_SECRET_ACCESS_KEY")
          [[ -n "${TF_BACKEND_BUCKET:-}"     ]] || missing+=("variable TF_BACKEND_BUCKET")
          [[ -n "${TF_BACKEND_ENDPOINT:-}"   ]] || missing+=("variable TF_BACKEND_ENDPOINT")
          [[ -n "${MODULES_APP_ID:-}"        ]] || missing+=("variable MODULES_APP_ID")
          [[ -n "${MODULES_APP_PRIVATE_KEY:-}" ]] || missing+=("secret MODULES_APP_PRIVATE_KEY")
          [[ -d "$LAYER_DIR"                 ]] || missing+=("layer directory $LAYER_DIR")
          [[ -d "$ACCOUNT_DIR"               ]] || missing+=("account directory $ACCOUNT_DIR")
          if [[ ${#missing[@]} -gt 0 ]]; then
            printf '::error::missing %s\n' "${missing[@]}"
            echo "See .github/workflows/README.md for the environments, secrets and variables this needs." >&2
            exit 1
          fi

      # A malformed token is rejected by Cloudflare with 6003/6111 - this checks that first
      - name: Check the API token is a well-formed bearer credential
        run: |
          set -euo pipefail
          tok="$CLOUDFLARE_API_TOKEN"

          # Fatal: the provider sends the value verbatim after "Bearer ", so
          # whitespace anywhere in it cannot produce a valid header.
          case "$tok" in
            *[[:space:]]*)
              echo "::error title=Malformed API token::CLOUDFLARE_API_TOKEN for environment '${{ inputs.environment }}' contains whitespace (length ${#tok}). Cloudflare rejects every request with 6003/6111. Re-set the secret without a trailing newline or a line break from a wrapped token - pipe it in rather than typing it as an argument."
              exit 1
              ;;
          esac

          # Fatal: a global API key authenticates with X-Auth-Key and X-Auth-Email
          # and is never a bearer credential, so this is unrecoverable rather than
          # merely misconfigured.
          case "$tok" in
            cfk_*)
              echo "::error title=Wrong credential type::CLOUDFLARE_API_TOKEN for environment '${{ inputs.environment }}' is a global API key (cfk_ prefix), not an API token. The provider sends it as 'Authorization: Bearer', which a global key does not support. Create an API token instead."
              exit 1
              ;;
            cfat_*) echo "token: account-owned (cfat_), length ${#tok}" ;;
            cfut_*) echo "token: user-owned (cfut_), length ${#tok}" ;;
            *)      echo "token: legacy unprefixed format, length ${#tok}" ;;
          esac

          # Advisory only. Catches a revoked, expired or wrong-account token before
          # a long plan, but a parse miss or a transient API blip must never block a
          # run - so every failure path below is a warning.
          #
          # Account-scoped endpoint on purpose: /user/tokens/verify rejects an
          # account-owned token with 1000 "Invalid API Token" even when the token is
          # valid and correctly scoped.
          account_id=$(grep -oE '[0-9a-f]{32}' "$ACCOUNT_DIR/account.tfvars" | head -n1 || true)
          if [[ -z "$account_id" ]]; then
            echo "::warning::no cloudflare_account_id found in $ACCOUNT_DIR/account.tfvars, skipping the live token check"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$account_id/tokens/verify" || echo 000)
          case "$code" in
            200) echo "token verified against account $account_id" ;;
            000) echo "::warning::could not reach the Cloudflare API to verify the token; continuing" ;;
            *)   echo "::warning title=Token did not verify::/accounts/$account_id/tokens/verify returned HTTP $code. The token may be revoked, expired, or not scoped to this account. Continuing - Terraform will give the authoritative error." ;;
          esac

      # Module sources point at the private modules repository, which
      # GITHUB_TOKEN cannot read. Must run before `terraform init`.
      - uses: ./.github/actions/modules-auth
        with:
          app-id: ${{ vars.MODULES_APP_ID }}
          private-key: ${{ secrets.MODULES_APP_PRIVATE_KEY }}

      - name: Setup Terraform ${{ inputs.terraform_version }}
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform_version }}
          # The wrapper rewrites exit codes, which breaks `plan -detailed-exitcode`.
          terraform_wrapper: false

      - name: Cache provider plugins
        uses: actions/cache@v6
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-plugins-${{ runner.os }}-${{ hashFiles('deployment/layers/*/.terraform.lock.hcl') }}
          restore-keys: tf-plugins-${{ runner.os }}-

      - name: Generate the R2 backend block
        run: |
          set -euo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"

          # The backend block is committed COMMENTED OUT (see the layer's
          # terraform.tf) so that `init -backend=false` works with no R2
          # dependency for offline CI. The pipeline therefore generates it, and
          # passes the account-specific parts at init time so no state location is
          # committed.
          #
          # If someone uncomments the committed block, two backend blocks exist and
          # Terraform fails with an unhelpful message. Catch it here instead.
          if grep -rhqE '^[[:space:]]*backend[[:space:]]+"' "$LAYER_DIR"/*.tf; then
            echo "::error::$LAYER_DIR has an uncommented backend block, and this" \
                 "pipeline generates backend.generated.tf. Keep the committed block" \
                 "commented out, or delete this step."
            exit 1
          fi

          # use_lockfile uses S3 conditional writes, which R2 supports. It needs
          # Terraform >= 1.11, which the layers' `required_version = ">= 1.11.0"`
          # enforces and the pinned version above satisfies. Both matter: the pin
          # covers this pipeline, the constraint covers anyone running locally.
          cat >"$LAYER_DIR/backend.generated.tf" <<'EOF'
          # Generated by .github/workflows/_terraform-run.yml. Never committed.
          terraform {
            backend "s3" {
              region                      = "auto"
              use_path_style              = true
              use_lockfile                = true
              skip_credentials_validation = true
              skip_metadata_api_check     = true
              skip_region_validation      = true
              skip_requesting_account_id  = true
              skip_s3_checksum            = true
            }
          }
          EOF

      - name: Terraform init
        run: |
          set -euo pipefail
          # One state key per account per layer. A waf apply cannot propose
          # destroying a zone because zones are not in its state.
          cd "$LAYER_DIR"
          terraform init -reconfigure -input=false \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=${STATE_KEY}" \
            -backend-config="endpoints={\"s3\":\"${TF_BACKEND_ENDPOINT}\"}"

      # -----------------------------------------------------------------------
      # RATE LIMITING
      # -----------------------------------------------------------------------
      # Cloudflare allows 1200 API requests per 5 minutes per credential
      - name: Start the Cloudflare API rate limiter
        if: inputs.api_rps > 0
        run: |
          set -euo pipefail
          nohup python3 .github/scripts/cf-api-throttle.py \
            --rps "$CF_THROTTLE_RPS" --port "$CF_THROTTLE_PORT" --verbose \
            >"$CF_THROTTLE_LOG" 2>&1 &
          echo $! >"$CF_THROTTLE_PID"

          # Readiness is polled rather than slept on: a limiter that failed to
          # bind must fail this step, not hand Terraform a connection-refused
          # error 20 minutes into a plan. The health endpoint costs no token.
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null --max-time 2 \
                 "http://127.0.0.1:${CF_THROTTLE_PORT}/__throttle/health"; then
              echo "rate limiter ready on 127.0.0.1:${CF_THROTTLE_PORT} at ${CF_THROTTLE_RPS} req/s"
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::the API rate limiter did not come up on port ${CF_THROTTLE_PORT}"
          cat "$CF_THROTTLE_LOG" >&2 || true
          exit 1

      # -----------------------------------------------------------------------
      # PLAN
      # -----------------------------------------------------------------------
      - name: Terraform plan
        id: plan
        if: inputs.mode == 'plan'
        env:
          TF_VAR_identity_provider_secrets: ${{ secrets.TF_VAR_IDENTITY_PROVIDER_SECRETS }}
        run: |
          set -euo pipefail
          # Which account var files this layer takes is derived from the config,
          # not hardcoded - see .github/scripts/tf-varfiles.sh. Written to a file
          # first so a non-zero exit from the script fails this step (a process
          # substitution into mapfile would swallow it).
          bash .github/scripts/tf-varfiles.sh "$LAYER_DIR" "$ACCOUNT_DIR" >varfiles.txt
          mapfile -t VARFILES <varfiles.txt
          if [[ ${#VARFILES[@]} -eq 0 ]]; then
            echo "::error::no var files in $ACCOUNT_DIR map to $LAYER_DIR"
            exit 1
          fi
          printf 'var file: %s\n' "${VARFILES[@]}"

          # Point the provider at the rate limiter. Keyed on the pidfile rather
          # than on the rps input so the two can never disagree: if the limiter
          # is not running, the provider talks to Cloudflare directly and only
          # -parallelism restrains it.
          if [[ -f "$CF_THROTTLE_PID" ]]; then
            export CLOUDFLARE_BASE_URL="http://127.0.0.1:${CF_THROTTLE_PORT}/client/v4"
            echo "provider base URL: $CLOUDFLARE_BASE_URL (rate limited to ${CF_THROTTLE_RPS} req/s)"
          fi

          cd "$LAYER_DIR"
          set +e
          terraform plan -out=tfplan -detailed-exitcode -lock-timeout=5m \
            -parallelism="$TF_PARALLELISM" "${VARFILES[@]}"
          ec=$?
          set -e
          # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes to make.
          # Only 1 is a failure.
          echo "exit_code=$ec" >>"$GITHUB_OUTPUT"
          if [[ $ec -eq 1 ]]; then
            exit 1
          fi

      - name: Summarise the plan
        id: summary
        if: inputs.mode == 'plan'
        run: |
          set -euo pipefail
          cd "$LAYER_DIR"

          # `terraform show -json` contains every attribute value. Only resource
          # addresses and actions are extracted from it, so the published summary
          # carries no zone IDs, DNS record contents or WAF expressions. The JSON
          # is deleted here and never uploaded.
          terraform show -json tfplan >tfplan.json
          jq -r '
            [.resource_changes[]? | select(.change.actions != ["no-op"])]
            | if length == 0 then "No changes."
              else (map("- `" + (.change.actions | join("+")) + "` " + .address) | join("\n"))
              end
          ' tfplan.json >plan-summary.md

          counts=$(jq -r '
            [.resource_changes[]?.change.actions] | flatten
            | "add=\(map(select(. == "create")) | length)"
              + " change=\(map(select(. == "update")) | length)"
              + " destroy=\(map(select(. == "delete")) | length)"
          ' tfplan.json)
          echo "counts=$counts" >>"$GITHUB_OUTPUT"
          rm -f tfplan.json

          {
            echo "### \`${{ inputs.account }}\` / \`${{ inputs.layer }}\` — $counts"
            echo
            cat plan-summary.md
            echo
            echo "_Resource addresses and actions only. Attribute values stay in the \`${{ inputs.plan_artifact }}\` artifact._"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Warn on planned destroys
        if: inputs.mode == 'plan'
        env:
          COUNTS: ${{ steps.summary.outputs.counts }}
        run: |
          set -euo pipefail
          if [[ "$COUNTS" == *"destroy=0"* ]]; then
            exit 0
          fi
          echo "::warning title=Destroy planned::${{ inputs.account }}/${{ inputs.layer }}: $COUNTS." \
               "On the zones layer, destroying a zone takes every DNS record in it." \
               "Read the plan artifact before approving."

      - name: Upload the plan
        if: inputs.mode == 'plan'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.plan_artifact }}
          path: ${{ env.LAYER_DIR }}/tfplan
          retention-days: ${{ inputs.plan_retention_days }}
          if-no-files-found: error

      - name: Comment the summary on the pull request
        if: inputs.mode == 'plan' && inputs.comment_on_pr && github.event_name == 'pull_request'
        # A comment that will not post is a reporting problem, not a plan
        # failure. The same summary is in the job summary and the plan artifact.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COUNTS: ${{ steps.summary.outputs.counts }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACCOUNT: ${{ inputs.account }}
          LAYER: ${{ inputs.layer }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          header=$(printf '#### Terraform plan — `%s` / `%s`\n\n`%s`\n\n' "$ACCOUNT" "$LAYER" "$COUNTS")
          footer=$(printf '\nAttribute values are not posted here. Full plan: [run #%s](%s).\n' "$RUN_NUMBER" "$RUN_URL")
          budget=$(( 63000 - ${#header} - ${#footer} ))
          total=$(wc -l <"$LAYER_DIR/plan-summary.md")
          awk -v budget="$budget" '
            { len = length($0) + 1
              if (used + len > budget) exit
              used += len
              print }
          ' "$LAYER_DIR/plan-summary.md" >body.md
          kept=$(wc -l <body.md)

          {
            printf '%s\n' "$header"
            cat body.md
            if [[ "$kept" -lt "$total" ]]; then
              printf '\n_Truncated: %s of %s changed resources listed. Full list in the job summary._\n' "$kept" "$total"
            fi
            printf '%s\n' "$footer"
          } >comment.md
          gh pr comment "$PR_NUMBER" --body-file comment.md

      # -----------------------------------------------------------------------
      # APPLY
      # -----------------------------------------------------------------------
      - name: Download the approved plan
        if: inputs.mode == 'apply'
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.plan_artifact }}
          path: ${{ env.LAYER_DIR }}

      - name: Terraform apply
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          # Unlike TF_VAR_, this is read at apply time: the provider block is
          # empty and takes its whole configuration from the environment, which
          # the provider re-reads when it is configured for the apply. Pointing
          # it here does not change what was planned - the plan holds resource
          # changes, not the endpoint they are sent to.
          if [[ -f "$CF_THROTTLE_PID" ]]; then
            export CLOUDFLARE_BASE_URL="http://127.0.0.1:${CF_THROTTLE_PORT}/client/v4"
            echo "provider base URL: $CLOUDFLARE_BASE_URL (rate limited to ${CF_THROTTLE_RPS} req/s)"
          fi

          cd "$LAYER_DIR"
          if [[ ! -f tfplan ]]; then
            echo "::error::no saved plan to apply - refusing to plan and apply in one step"
            exit 1
          fi
          # No -var-file and no -auto-approve: applying a saved plan takes neither.
          # The plan file already holds the resolved variable values, which is
          # exactly why apply cannot diverge from what was reviewed.
          terraform apply -lock-timeout=5m -input=false \
            -parallelism="$TF_PARALLELISM" tfplan

      # Bulk KV data is loaded after apply if used
      - name: Setup Node for wrangler
        if: inputs.mode == 'apply' && inputs.layer == 'workers'
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Load KV datasets
        if: inputs.mode == 'apply' && inputs.layer == 'workers'
        run: |
          set -euo pipefail
          # Same derivation the token check above uses - the account ID is a fact
          # of the account tree, not a secret, and wrangler reads it from the
          # environment. CLOUDFLARE_API_TOKEN is already job-level env.
          CLOUDFLARE_ACCOUNT_ID="$(grep -oE '[0-9a-f]{32}' "$ACCOUNT_DIR/account.tfvars" | head -n1)"
          export CLOUDFLARE_ACCOUNT_ID
          bash .github/scripts/kv-bulk-load.sh "$LAYER_DIR"

      - name: Record what was applied
        if: always() && inputs.mode == 'apply'
        run: |
          echo "### Applied \`${{ inputs.account }}\` / \`${{ inputs.layer }}\` — ${{ job.status }}" \
            >>"$GITHUB_STEP_SUMMARY"

      # Runs after the KV load, which talks to Cloudflare through wrangler
      - name: Stop the rate limiter and report what it absorbed
        if: always()
        run: |
          set -euo pipefail
          [[ -f "$CF_THROTTLE_PID" ]] || exit 0
          pid="$(cat "$CF_THROTTLE_PID")"

          # A limiter that died mid-run is worth saying out loud: Terraform would
          # have carried on against Cloudflare directly, unpaced, so a 429 in the
          # log above has a different cause than "rps too high".
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::warning title=Rate limiter exited early::cf-api-throttle.py (pid $pid) was no longer running at the end of this job. Any Cloudflare request after it exited was unthrottled."
          else
            # SIGTERM rather than SIGKILL: the handler prints the request count,
            # how many 429s it absorbed and the worst queue wait, which is the
            # only evidence of whether api_rps is set sensibly for this layer.
            kill -TERM "$pid" 2>/dev/null || true
            for _ in $(seq 1 20); do
              kill -0 "$pid" 2>/dev/null || break
              sleep 0.5
            done
            kill -KILL "$pid" 2>/dev/null || true
          fi

          if [[ -s "$CF_THROTTLE_LOG" ]]; then
            echo "::group::Cloudflare API rate limiter"
            cat "$CF_THROTTLE_LOG"
            echo "::endgroup::"
            # The summary line is the useful one for tuning api_rps, so it goes
            # in the job summary next to the plan counts.
            grep -h 'requests=' "$CF_THROTTLE_LOG" | tail -n1 \
              | sed 's/^/- API rate limiter: /' >>"$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Remove generated files
        if: always()
        run: |
          rm -f "$LAYER_DIR/backend.generated.tf" "$LAYER_DIR/tfplan" \
                "$LAYER_DIR/tfplan.json" varfiles.txt comment.md \
                "$CF_THROTTLE_PID" "$CF_THROTTLE_LOG"
