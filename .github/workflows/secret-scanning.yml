# Secret Scanning - Automated credential and token leakage detection.
# Runs on pull requests, pushes to main, and manual invocation.
# Specifically guards against Cloudflare API tokens (cfat_ prefix).
name: Secret Scanning

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scanning-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  secret-scan:
    name: betterleaks & token guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Betterleaks Secrets Scan
        uses: dortort/betterleaks-action@v0.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-leak: 'true'

      - name: Strict Cloudflare Token Guard (cfat_)
        run: |
          set -euo pipefail

          echo "Commencing strict Cloudflare API token prefix (cfat_) scan..."
          cfat_detected=0

          # 1. Scan all tracked files in working directory
          tracked_matches="$(git grep -I -n -i 'cfat_' || true)"
          if [[ -n "$tracked_matches" ]]; then
            echo "::error::Cloudflare API token prefix 'cfat_' detected in tracked repository files:"
            echo "$tracked_matches"
            cfat_detected=1
          fi

          # 2. If running under pull request, scan changed lines in the diff against base branch
          if [[ "${{ github.event_name }}" == "pull_request" && -n "${{ github.base_ref }}" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=100 --quiet || true
            diff_matches="$(git diff -U0 "origin/${{ github.base_ref }}...HEAD" | grep -E -i '^\+[[:space:]]*.*cfat_' || true)"
            if [[ -n "$diff_matches" ]]; then
              echo "::error::Cloudflare API token prefix 'cfat_' detected in pull request diff additions:"
              echo "$diff_matches"
              cfat_detected=1
            fi
          fi

          # 3. Fail job if token prefix was detected
          if [[ "$cfat_detected" -ne 0 ]]; then
            echo "::error::Secret scan failed: Cloudflare token prefix 'cfat_' found. Please revoke any exposed tokens immediately."
            exit 1
          fi

          echo "Secret scan passed successfully. No cfat_ token prefixes identified."
