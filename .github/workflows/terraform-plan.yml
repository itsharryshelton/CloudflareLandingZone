# Plan - talks to Cloudflare, changes nothing.
#
# What it needs, per account, is a READ-ONLY Cloudflare token in the
# `<account>-plan` environment. See .github/workflows/README.md.

name: Terraform Plan

on:
  workflow_dispatch:
    inputs:
      account:
        description: 'Account directory name, or "all".'
        required: false
        default: 'all'
        type: string
      layer:
        description: 'Layer directory name, or "all".'
        required: false
        default: 'all'
        type: string

permissions:
  contents: read

concurrency:
  group: tf-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: select affected pairs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      any: ${{ steps.select.outputs.any }}
    steps:
      # No diff to resolve - a manual run selects on the inputs alone, so the
      # default shallow checkout is enough.
      - uses: actions/checkout@v7

      - name: Select
        id: select
        env:
          # A manual run has no meaningful base to diff against, so it plans every
          # pair the `account` / `layer` narrowing allows. Narrow it, or this is
          # the whole fleet.
          BASE_SHA: ''
          HEAD_SHA: ${{ github.sha }}
          FORCE_ALL: 'true'
          ONLY_ACCOUNT: ${{ inputs.account || 'all' }}
          ONLY_LAYER: ${{ inputs.layer || 'all' }}
        run: bash .github/scripts/tf-matrix.sh

  # Planning a layer that depends on a zone which does not exist at Cloudflare yet
  # fails, because layers resolve zones through data "cloudflare_zone" rather than
  # each other's state (deployment/README.md). So a preview of a brand new zone
  # plus its waf / load_balancing / r2 config can only cover the zones layer until
  # the zone has actually been applied. Not a pipeline bug.
  plan:
    name: plan
    needs: discover
    if: needs.discover.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/_terraform-run.yml
    with:
      account: ${{ matrix.account }}
      layer: ${{ matrix.layer }}
      mode: plan
      environment: ${{ matrix.account }}-plan
      plan_artifact: tfplan-${{ matrix.account }}-${{ matrix.layer }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Nothing to comment on - this workflow no longer runs on pull requests.
      comment_on_pr: false
    secrets: inherit

  plan-complete:
    name: plan complete
    runs-on: ubuntu-latest
    needs: [discover, plan]
    if: always()
    steps:
      - name: Report
        run: |
          set -euo pipefail
          discover='${{ needs.discover.result }}'
          plan='${{ needs.plan.result }}'
          echo "discover=$discover plan=$plan"

          if [[ "$discover" != "success" ]]; then
            echo "::error::could not determine which pairs to plan"
            exit 1
          fi
          case "$plan" in
            success) echo "All selected plans succeeded." ;;
            skipped) echo "The account / layer narrowing selected no pair - nothing to plan." ;;
            *)       echo "::error::at least one plan failed"; exit 1 ;;
          esac
